inks{display:grid;gap:12px;margin-top:20px}.link-box{border-radius:15px;background:#041b32a8;padding:13px 14px}.link-box small{display:block;color:#94b9cb;margin-bottom:5px}.link-line{display:flex;gap:10px;align-items:center}.link-line code{font-size:13px;overflow-wrap:anywhere;color:#b6f4de;flex:1}.link-line button{border:0;background:none;color:var(--cyan);font-size:13px;font-weight:700}.preview{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.preview:after{content:'〰';position:absolute;bottom:12px;right:18px;color:#8de7df25;font-size:100px;transform:rotate(-10deg)}.preview-count{font-size:64px;font-weight:900;color:var(--mint);line-height:1;margin:28px 0 8px}.tip{border-left:3px solid var(--cyan);padding:8px 0 8px 13px;color:#bdd7e4;font-size:13px;line-height:1.8}.foot{margin-top:24px;text-align:center;color:#86a9bc;font-size:12px}.screen{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#1672a0 0,#0d527e 35%,#07345b 70%,#051e39 100%)}.screen:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,#b4eff544,transparent 48%),linear-gradient(180deg,transparent 73%,#02182ce6 100%);pointer-events:none}.bubble{position:absolute;border:1px solid #d2ffff66;border-radius:50%;background:#d3ffff10;animation:rise 11s linear infinite}.bubble:nth-child(1){width:10px;height:10px;left:8%;bottom:-20px}.bubble:nth-child(2){width:17px;height:17px;left:30%;bottom:-30px;animation-delay:3s;animation-duration:13s}.bubble:nth-child(3){width:8px;height:8px;left:71%;bottom:-20px;animation-delay:6s}.bubble:nth-child(4){width:13px;height:13px;left:90%;bottom:-25px;animation-delay:1s;animation-duration:15s}@keyframes rise{to{transform:translateY(-110vh) translateX(30px);opacity:0}}.waterline{position:absolute;top:0;left:0;right:0;height:4px;background:#abffff8c;box-shadow:0 0 28px #74ecff}.school-title{position:absolute;z-index:3;top:28px;left:36px;display:flex;align-items:center;gap:12px;text-shadow:0 2px 12px #03243b}.school-title strong{font-size:18px;letter-spacing:.14em}.school-title small{color:#b6e5f0}.fish-layer{position:absolute;inset:8% 0 6%;overflow:hidden}.swimmer{position:absolute;width:clamp(130px,20vw,260px);height:auto;filter:drop-shadow(0 12px 13px #001a2a66);animation:swim var(--speed,18s) ease-in-out infinite alternate;left:var(--x);top:var(--y);transform:scaleX(var(--flip,1))}@keyframes swim{0%{translate:-4vw 4px}50%{translate:3vw -13px}100%{translate:0 10px}}.swimmer img{width:100%;height:auto;object-fit:contain}.display-count{position:absolute;right:32px;top:28px;color:#d5f7ff;font-size:13px;letter-spacing:.12em}.empty-ocean{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#b9e5ef}.empty-ocean b{display:block;font-size:clamp(22px,4vw,38px);margin-bottom:9px}.empty-ocean p{margin:0;opacity:.8}.draw-shell{width:min(1020px,calc(100% - 28px));margin:0 auto;padding:18px 0 28px}.draw-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.draw-head .brand-mark{width:38px;height:38px;border-radius:13px;font-size:22px}.draw-head h1{font-size:19px;margin:0}.draw-head small{color:#a8c8d8}.draw-card{padding:20px;background:#e6f9f1;border-radius:24px;color:#153c51;box-shadow:0 20px 60px #00101e66}.draw-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}.swatches{display:flex;gap:7px}.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #173f5033;cursor:pointer}.swatch.active{box-shadow:0 0 0 3px #328aa2}.tool-btn{border:1px solid #b9d6d4;background:white;color:#25536a;border-radius:11px;padding:8px 12px;font-size:13px;font-weight:700}.tool-btn.active{background:#153e57;color:white}.spacer{flex:1}.canvas-wrap{width:100%;height:min(54vh,440px);min-height:260px;background:white;border-radius:16px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 1px #bdd9d9}.canvas-wrap canvas{width:100%;height:100%;display:block;cursor:crosshair}.draw-footer{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}.draw-footer .text-input{background:white;color:#12394d;border-color:#c4dedb;max-width:240px;padding:11px 13px}.draw-footer .muted{color:#668594;font-size:12px}.status{font-size:13px;color:#326b69;min-height:20px}.home-link{color:#b8e9eb;text-decoration:none;font-size:13px}.loading{opacity:.85}

<script>
// Supabase project settings: public publishable key is safe for browser use when RLS is enabled.
const SUPABASE_URL='https://uupqqhctvplywaffeqnb.supabase.co';
const SUPABASE_KEY='sb_publishable_4m5PHXCwQbs0_lDZCBEubQ_HHHgnRyz';
const app=document.querySelector('#app');
const BASE_PATH=location.hostname.endsWith('github.io')?'/digitalaquarium':'';
let rawPath=decodeURIComponent(location.pathname);if(BASE_PATH&&rawPath.startsWith(BASE_PATH))rawPath=rawPath.slice(BASE_PATH.length);
const pathname=rawPath.replace(/^\/+|\/+$/g,'');
const match=pathname.match(/^(.*)-(new|photo|settings|display)$/i);
const room=match?.[1]||''; const mode=match?.[2]?.toLowerCase()||'home';
const colors=['#f45f63','#ffb443','#f7d85b','#60cc9b','#54b9f0','#8b7df1','#ed83c0','#173d55','#ffffff'];
const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
function safeRoom(code){return /^[A-Za-z0-9]+$/.test(code)}
function fishApi(code){return SUPABASE_URL+'/rest/v1/fish?room_code=eq.'+encodeURIComponent(code)+'&select=id,room_code,name,image_data,created_at&order=created_at.asc'}
async function getFish(code){const r=await fetch(fishApi(code),{headers});if(!r.ok)throw Error('読み込みに失敗しました ('+r.status+')');return r.json()}
async function addFish(code,name,image){const r=await fetch(SUPABASE_URL+'/rest/v1/fish',{method:'POST',headers:{...headers,'Prefer':'return=minimal'},body:JSON.stringify({room_code:code,name:name||'なまえのない魚',image_data:image})});if(!r.ok){const t=await r.text();throw Error('投稿できませんでした: '+t.slice(0,160))}}
async function removeFish(code,id){const r=await fetch(SUPABASE_URL+'/rest/v1/fish?room_code=eq.'+encodeURIComponent(code)+'&id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{...headers,'Prefer':'return=minimal'}});if(!r.ok)throw Error('削除に失敗しました')}
function routeUrl(code,suffix){return location.origin+BASE_PATH+'/'+code+'-'+suffix}
function copyText(text,btn){navigator.clipboard?.writeText(text).then(()=>{let old=btn.textContent;btn.textContent='コピーしました';setTimeout(()=>btn.textContent=old,1400)}).catch(()=>prompt('URLをコピーしてください',text))}
function renderHome(){app.innerHTML=`<div class="shell"><div class="brand"><div class="brand-mark">🐠</div><div><div class="eyebrow">DRAW YOUR OWN SEA</div><div>お絵かき水族館</div></div></div><section class="hero"><div class="eyebrow">みんなの絵が、海を泳ぐ。</div><h1>描いて、投稿して、<br><span>水族館に泳がせよう。</span></h1><p>好きな生き物を描いて専用URLから投稿。スクリーンには、みんなの作品がゆったり泳ぎ出します。</p></section><div class="admin-grid"><section class="card"><div class="eyebrow">ORGANIZER</div><h2>主催者画面</h2><p class="muted">開催場所ごとの識別コードを決めると、投稿用と表示用のURLを作れます。英数字なら長さは自由です。</p><label class="label" for="roomCode">識別コード</label><div class="input-row"><input class="text-input" id="roomCode" placeholder="例：summer2026" autocomplete="off"><button class="btn" id="makeLinks">URLを作成</button></div><div id="links"></div><p class="muted" style="margin-top:18px;font-size:12px">投稿データはSupabaseに保存されます。同じ識別コードの作品だけが同じ水槽に表示されます。</p></section><section class="card preview"><div><div class="eyebrow">YOUR AQUARIUM</div><h2>会場のスクリーンに</h2><p class="muted">表示用URLを開いて、全画面にすれば準備OK。作品が増えるたびに水槽へ加わります。</p></div><div><div class="preview-count">∞</div><div class="muted">世界にひとつの、みんなの海。</div></div><div class="tip">💡 識別コードは、会場やイベントごとに分けて使えます。</div></section></div><div class="foot">お絵かき水族館 ・ 描いた作品はみんなの画面に表示されます</div></div>`;
const input=document.querySelector('#roomCode'),links=document.querySelector('#links');document.querySelector('#makeLinks').onclick=()=>{const code=input.value.trim();if(!safeRoom(code)){links.innerHTML='<p class="muted" style="color:#ffb8ad">英字と数字だけの識別コードを入力してください。</p>';return}links.innerHTML=`<div class="links"><div class="link-box"><small>✏️ 生き物を描いて投稿するURL</small><div class="link-line"><code>${routeUrl(code,'new')}</code><button data-copy="new">コピー</button></div></div><div class="link-box"><small>🖥️ 会場の画面に映すURL</small><div class="link-line"><code>${routeUrl(code,'display')}</code><button data-copy="display">コピー</button></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"><a class="btn" style="text-decoration:none" href="${BASE_PATH}/${code}-display" target="_blank">水槽をプレビュー ↗</a><a class="btn secondary" style="text-decoration:none" href="${BASE_PATH}/${code}-new" target="_blank">投稿画面を試す ↗</a><a class="btn secondary" style="text-decoration:none" href="${BASE_PATH}/${code}-settings" target="_blank">設定・生き物管理 ↗</a></div></div>`;links.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(routeUrl(code,b.dataset.copy),b))};input.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#makeLinks').click()})}
function renderDraw(){if(!safeRoom(room)){app.innerHTML='<div class="shell"><a class="home-link" href="'+BASE_PATH+'/">← 主催者画面へ</a><h1>URLの識別コードを確認してください</h1></div>';return}app.innerHTML=`<div class="draw-shell"><header class="draw-head"><div class="brand"><div class="brand-mark">🐠</div><div><h1>お絵かき水族館</h1><small>水槽：${room}</small></div></div><a class="home-link" href="${BASE_PATH}/">主催者画面</a></header><section class="draw-card"><div class="draw-tools"><div class="swatches">${colors.map((c,i)=>`<button class="swatch ${i===0?'active':''}" data-color="${c}" style="background:${c}" aria-label="色 ${i+1}"></button>`).join('')}</div><span class="spacer"></span><button class="tool-btn active" id="pen">✏️ ペン</button><button class="tool-btn" id="eraser">消しゴム</button><button class="tool-btn" id="undo">ひとつ戻す</button><button class="tool-btn" id="clear">ぜんぶ消す</button></div><div class="canvas-wrap"><canvas id="board" aria-label="生き物を描くキャンバス"></canvas></div><div class="draw-footer"><input id="fishName" class="text-input" maxlength="24" placeholder="生き物のなまえ（任意）"><button id="submit" class="btn">海に泳がせる →</button><span id="status" class="status" role="status"></span></div><p class="muted" style="color:#668594;margin:12px 2px 0;font-size:12px">自由に描いて投稿しよう。投稿した絵はこの水槽の表示画面に現れます。</p></section></div>`;
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d');let drawing=false,color=colors[0],erase=false,history=[];function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;if(canvas.width)old.getContext('2d').drawImage(canvas,0,0);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);ctx.lineCap='round';ctx.lineJoin='round'}resize();new ResizeObserver(resize).observe(canvas.parentElement);function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function saveHistory(){history.push(canvas.toDataURL());if(history.length>12)history.shift()}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);saveHistory();drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.strokeStyle=erase?'#fff':color;ctx.lineWidth=erase?30:7;ctx.stroke()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.strokeStyle=erase?'#fff':color;ctx.lineWidth=erase?30:7;ctx.lineTo(p.x,p.y);ctx.stroke()});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,()=>drawing=false));document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{document.querySelector('.swatch.active')?.classList.remove('active');b.classList.add('active');color=b.dataset.color;erase=false;document.querySelector('#pen').classList.add('active');document.querySelector('#eraser').classList.remove('active')});document.querySelector('#pen').onclick=()=>{erase=false;document.querySelector('#pen').classList.add('active');document.querySelector('#eraser').classList.remove('active')};document.querySelector('#eraser').onclick=()=>{erase=true;document.querySelector('#eraser').classList.add('active');document.querySelector('#pen').classList.remove('active')};document.querySelector('#undo').onclick=()=>{const data=history.pop();if(data){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width/(Math.min(devicePixelRatio||1,2)),canvas.height/(Math.min(devicePixelRatio||1,2)))};im.src=data}};document.querySelector('#clear').onclick=()=>{saveHistory();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight)};document.querySelector('#submit').onclick=async()=>{const btn=document.querySelector('#submit'),status=document.querySelector('#status');btn.disabled=true;status.textContent='海へ送っています…';try{const image=await removeWhiteBackground(canvas);await addFish(room,document.querySelector('#fishName').value.trim(),image);status.textContent='投稿できました！水槽を見てみよう 🐠';history=[];ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);document.querySelector('#fishName').value=''}catch(e){status.textContent=e.message}finally{btn.disabled=false}}}

function isPaper(r,g,b){const hi=Math.max(r,g,b),lo=Math.min(r,g,b);return lo>135&&(hi-lo)<72}
function removeWhiteBackground(source){const w=source.width,h=source.height;if(!w||!h)throw Error('画像を読み込めませんでした');const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(source,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,n=w*h,seen=new Uint8Array(n),queue=new Int32Array(n);let head=0,tail=0;function add(i){if(i<0||i>=n||seen[i])return;seen[i]=1;const p=i*4;if(isPaper(d[p],d[p+1],d[p+2]))queue[tail++]=i}for(let xx=0;xx<w;xx++){add(xx);add((h-1)*w+xx)}for(let yy=0;yy<h;yy++){add(yy*w);add(yy*w+w-1)}while(head<tail){const i=queue[head++],p=i*4,lum=.299*d[p]+.587*d[p+1]+.114*d[p+2];d[p+3]=Math.max(0,Math.min(255,Math.round((238-lum)*3.2)));if(i%w)add(i-1);if(i%w<w-1)add(i+1);if(i>=w)add(i-w);if(i<n-w)add(i+w)}x.putImageData(im,0,0);return c.toDataURL('image/png')}
async function getRoomMode(code){const r=await fetch(SUPABASE_URL+'/rest/v1/room_settings?room_code=eq.'+encodeURIComponent(code)+'&select=post_mode&limit=1',{headers});if(!r.ok)throw Error('設定を読み込めません');const a=await r.json();return a[0]?.post_mode||'draw'}
async function setRoomMode(code,postMode){const r=await fetch(SUPABASE_URL+'/rest/v1/room_settings?on_conflict=room_code',{method:'POST',headers:{...headers,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({room_code:code,post_mode:postMode,updated_at:new Date().toISOString()})});if(!r.ok)throw Error('設定を保存できませんでした')}
function renderPhoto(){if(!safeRoom(room)){app.innerHTML='<div class="shell">識別コードを確認してください</div>';return}app.innerHTML=`<div class="draw-shell"><header class="draw-head"><div class="brand"><div class="brand-mark">📷</div><div><h1>写真を投稿</h1><small>水槽：${room}</small></div></div><a class="home-link" href="${BASE_PATH}/${room}-settings">設定・管理</a></header><section class="draw-card"><h2>紙に描いた生き物を撮ろう</h2><p class="photo-help">白い紙に描いた絵を撮影または選択してください。白い背景を自動で透過し、確認してから水槽へ送ります。</p><label class="btn" for="photoInput">写真を撮る・選ぶ</label><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><div class="photo-preview empty" id="photoPreview" style="margin-top:16px"><span class="photo-help">撮影した写真の背景を透過して、ここに表示します</span></div><div class="draw-footer"><input id="photoName" class="text-input" maxlength="24" placeholder="生き物のなまえ（任意）"><button class="btn" id="sendPhoto" disabled>これでよろしいですか？ 送信</button><button class="tool-btn" id="retake" hidden>撮り直す</button><span id="photoStatus" class="status" role="status"></span></div><p class="photo-help">背景の判定は画像の端からつながる白〜薄い灰色の範囲で行います。絵の外側に濃い影がある場合は、紙を明るく撮り直してください。</p></section></div>`;let processed='';const input=document.querySelector('#photoInput'),preview=document.querySelector('#photoPreview'),send=document.querySelector('#sendPhoto'),status=document.querySelector('#photoStatus');input.onchange=async()=>{const f=input.files?.[0];if(!f)return;status.textContent='背景を透過しています…';send.disabled=true;try{const bitmap=await createImageBitmap(f),scale=Math.min(1,1200/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.round(bitmap.width*scale);c.height=Math.round(bitmap.height*scale);const cx=c.getContext('2d');cx.drawImage(bitmap,0,0,c.width,c.height);bitmap.close();processed=removeWhiteBackground(c);preview.classList.remove('empty');preview.innerHTML='';const img=document.createElement('img');img.src=processed;img.alt='背景透過後の確認画像';preview.append(img);send.disabled=false;document.querySelector('#retake').hidden=false;status.textContent='背景を透過しました。確認してから送信してください。'}catch(e){status.textContent='写真を処理できませんでした: '+e.message}};document.querySelector('#retake').onclick=()=>{input.value='';processed='';preview.classList.add('empty');preview.innerHTML='<span class="photo-help">撮影した写真の背景を透過して、ここに表示します</span>';send.disabled=true;document.querySelector('#retake').hidden=true;status.textContent=''};send.onclick=async()=>{send.disabled=true;status.textContent='水槽へ送信しています…';try{await addFish(room,document.querySelector('#photoName').value.trim(),processed);status.textContent='投稿できました！🐠';document.querySelector('#photoName').value=''}catch(e){status.textContent=e.message;send.disabled=false}}}
function renderSettings(){if(!safeRoom(room)){app.innerHTML='<div class="shell">識別コードを確認してください</div>';return}app.innerHTML=`<div class="shell"><div class="brand"><div class="brand-mark">🐠</div><div><div class="eyebrow">ORGANIZER SETTINGS</div><div>水槽の設定・生き物管理</div></div></div><p><a class="home-link" href="${BASE_PATH}/">← 主催者画面</a>　<span class="muted">識別コード：${room}</span></p><div class="settings-layout"><section class="card qr-box"><div><div class="eyebrow">POST URL QR</div><h2>投稿用QRコード</h2><canvas id="postQr" width="180" height="180"></canvas><p class="muted" id="postUrl"></p><button class="btn secondary" id="copyPost">URLをコピー</button></div></section><section class="card"><div class="eyebrow">POSTING MODE</div><h2>投稿方法</h2><p class="muted">QRコードで開く投稿画面を選びます。</p><div class="choice"><label><input type="radio" name="postMode" value="draw"> 画面に直接お絵かき</label><label><input type="radio" name="postMode" value="photo"> 写真を撮って投稿</label></div><p class="muted" id="settingsStatus">設定を読み込み中…</p></section></div><section class="card" style="margin-top:22px"><div class="eyebrow">AQUARIUM</div><h2>投稿された生き物 <span id="fishTotal"></span></h2><p class="muted">表示から外す作品は「削除」を押してください。</p><div class="fish-list" id="fishList"></div></section></div>`;let currentMode='draw';const urlEl=document.querySelector('#postUrl'),qr=document.querySelector('#postQr'),status=document.querySelector('#settingsStatus');function updateQr(){const url=routeUrl(room,currentMode==='photo'?'photo':'new');urlEl.textContent=url;if(window.QRCode)QRCode.toCanvas(qr,url,{width:180,margin:1},e=>{if(e)status.textContent='QRコードを作成できませんでした'});else status.textContent='QRコードライブラリを読み込めません。URLは下に表示しています。'}async function loadList(){const listEl=document.querySelector('#fishList');try{const list=await getFish(room);document.querySelector('#fishTotal').textContent='('+list.length+'匹)';listEl.innerHTML='';if(!list.length){listEl.textContent='まだ投稿はありません';return}for(const f of list){const row=document.createElement('div');row.className='fish-row';const img=document.createElement('img');img.src=f.image_data;img.alt='';const info=document.createElement('div');info.className='fish-info';const name=document.createElement('strong');name.textContent=f.name||'なまえのない魚';const date=document.createElement('small');date.textContent=new Date(f.created_at).toLocaleString('ja-JP');info.append(name,date);const del=document.createElement('button');del.className='btn danger';del.textContent='削除';del.onclick=async()=>{if(!confirm('この生き物を水槽から削除しますか？'))return;del.disabled=true;try{await removeFish(room,f.id);await loadList()}catch(e){alert(e.message);del.disabled=false}};row.append(img,info,del);listEl.append(row)}}catch(e){listEl.textContent='読み込みに失敗しました: '+e.message}}document.querySelectorAll('[name=postMode]').forEach(r=>r.onchange=async()=>{currentMode=r.value;updateQr();status.textContent='設定を保存しています…';try{await setRoomMode(room,currentMode);status.textContent='保存しました。QRコードの投稿先を更新しました。'}catch(e){status.textContent=e.message}});document.querySelector('#copyPost').onclick=e=>copyText(routeUrl(room,currentMode==='photo'?'photo':'new'),e.currentTarget);getRoomMode(room).then(m=>{currentMode=m;document.querySelector(`[name=postMode][value="${m}"]`).checked=true;updateQr();status.textContent='設定を読み込みました'}).catch(e=>{status.textContent=e.message;updateQr()});loadList()}

function renderDisplay(){if(!safeRoom(room)){app.innerHTML='識別コードを確認してください';return}app.innerHTML=`<section class="screen"><div class="waterline"></div><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><div class="school-title"><span style="font-size:28px">🐠</span><div><strong>お絵かき水族館</strong><br><small>みんなの生き物が泳いでいるよ</small></div></div><div class="display-count" id="fishCount">${room} ・ 接続中</div><div class="fish-layer" id="fishLayer"><div class="empty-ocean"><div><b>海を準備しています…</b><p>作品が届くと、ここを泳ぎはじめます</p></div></div></div></section>`;const layer=document.querySelector('#fishLayer'),count=document.querySelector('#fishCount');let known=new Set();async function refresh(){try{const list=await getFish(room);count.textContent=room+' ・ '+list.length+' 匹';if(list.length===0){layer.innerHTML='<div class="empty-ocean"><div><b>海に生き物を泳がせよう</b><p>投稿URLから絵を送ると、ここに現れます 🫧</p></div></div>';known.clear();return}const empty=layer.querySelector('.empty-ocean');if(empty)empty.remove();list.forEach((f,i)=>{if(known.has(f.id))return;known.add(f.id);const node=document.createElement('div');node.className='swimmer';node.style.setProperty('--x',(5+(i*31)%76)+'%');node.style.setProperty('--y',(12+(i*23)%68)+'%');node.style.setProperty('--speed',(13+(i*7)%17)+'s');node.style.setProperty('--flip',i%2?'1':'-1');const im=document.createElement('img');im.src=f.image_data;im.alt=f.name||'みんなが描いた生き物';im.title=f.name||'みんなが描いた生き物';node.append(im);layer.append(node)})}catch(e){count.textContent='接続エラー ・ '+room;console.error(e)}}refresh();setInterval(refresh,5000)}
if(mode==='new')renderDraw();else if(mode==='photo')renderPhoto();else if(mode==='settings')renderSettings();else if(mode==='display')renderDisplay();else renderHome();
</script></body></html>
